spring:
  application:
    name: alldare-podcasts
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alldare_podcasts}
    username: ${SPRING_DATASOURCE_USERNAME:alldare_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:password}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://alldare-auth:9000/oauth2/jwks}
          issuer-uri: ${AUTH_ISSUER_URI:http://alldare-auth:9000}

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

alldare:
  podcasts:
    cdn-base-url: ${CDN_BASE_URL:https://cdn.alldare.online}
    feed-base-url: ${FEED_BASE_URL:https://podcasts.alldare.online}

server:
  port: 8089

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9089}
  client:
    posts-service:
      address: ${POSTS_GRPC_ADDRESS:static://posts:9080}
      negotiation-type: plaintext
    ads-service:
      address: ${ADS_GRPC_ADDRESS:static://ads:9088}
      negotiation-type: plaintext

logging:
  level:
    online.alldare.podcasts: TRACE
    org.springframework.web: INFO
    org.flywaydb: DEBUG
